<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CAESAR – Connexion</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="app app--auth">
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="app-title">CAESAR</h1>
            <p class="app-subtitle">Control &amp; Assessment Security Agents Runtime</p>
        </div>
        <form method="post" action="/login" class="auth-form">
            <div class="field">
                <label for="username">Identifiant</label>
                <input id="username" name="username" type="text" placeholder="admin" required>
            </div>
            <div class="field">
                <label for="password">Mot de passe</label>
                <input id="password" name="password" type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Se connecter</button>
        </form>
        <p class="auth-footnote">Démo : les identifiants ne sont pas encore vérifiés.</p>
    </div>
</div>
</body>
</html>
