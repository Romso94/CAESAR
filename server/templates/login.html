<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CAESAR – Connexion</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="app app--auth">
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="app-title">CAESAR</h1>
            <p class="app-subtitle">Control &amp; Assessment Security Agents Runtime</p>
        </div>
        {% if error %}
        <div style="background: #d83b01; color: white; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem;">
            {{ error }}
        </div>
        {% endif %}
        
        {% if request.query_params.get("registered") %}
        <div style="background: #107c10; color: white; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem;">
            Inscription réussie ! Vous pouvez maintenant vous connecter.
        </div>
        {% endif %}
        
        <form method="post" action="/login" class="auth-form">
            <div class="field">
                <label for="username">Identifiant</label>
                <input id="username" name="username" type="text" placeholder="admin" required>
            </div>
            <div class="field">
                <label for="password">Mot de passe</label>
                <input id="password" name="password" type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Se connecter</button>
        </form>
        <p class="auth-footnote">
            Pas encore de compte ? <a href="/register" style="color: #38bdf8; text-decoration: none;">S'inscrire</a>
        </p>
    </div>
</div>
</body>
</html>
