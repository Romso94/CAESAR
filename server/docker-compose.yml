services:
  mongodb:
    image: mongo:7.0
    container_name: caesar-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-caesar}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - caesar-network

  mongodb-scans:
    image: mongo:7.0
    container_name: caesar-mongodb-scans
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_SCANS_USERNAME:-scans}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_SCANS_PASSWORD:-scans123}
      MONGO_INITDB_DATABASE: ${MONGO_SCANS_DATABASE:-caesar_scans}
    ports:
      - "27018:27017"
    volumes:
      - mongodb_scans_data:/data/db
      - mongodb_scans_config:/data/configdb
    networks:
      - caesar-network

  server:
    build: .
    container_name: caesar-server
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      WEBSOCKET_HOST: ${WEBSOCKET_HOST:-0.0.0.0}
      WEBSOCKET_PORT: ${WEBSOCKET_PORT:-8765}
      MONGO_HOST: ${MONGO_HOST:-mongodb}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-caesar}
      MONGO_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_SCANS_HOST: ${MONGO_SCANS_HOST:-mongodb-scans}
      MONGO_SCANS_PORT: ${MONGO_SCANS_PORT:-27017}
      MONGO_SCANS_DATABASE: ${MONGO_SCANS_DATABASE:-caesar_scans}
      MONGO_SCANS_USERNAME: ${MONGO_SCANS_USERNAME:-scans}
      MONGO_SCANS_PASSWORD: ${MONGO_SCANS_PASSWORD:-scans123}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
    ports:
      - "${API_PORT:-8000}:8000"
      - "${WEBSOCKET_PORT:-8765}:8765"
    depends_on:
      - mongodb
      - mongodb-scans
    networks:
      - caesar-network
    volumes:
      - ./templates:/app/server/templates
      - ./static:/app/server/static

volumes:
  mongodb_data:
  mongodb_config:
  mongodb_scans_data:
  mongodb_scans_config:

networks:
  caesar-network:
    driver: bridge
